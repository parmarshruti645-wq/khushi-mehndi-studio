<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf4ea"/>
      <stop offset="100%" stop-color="#eddcc9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative border -->
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="#c9973a" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6,4"/>
  <rect x="35" y="35" width="530" height="530" rx="12" fill="none" stroke="#c9973a" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Icon: Soap bar with botanicals -->
  <g transform="translate(300, 240)">
    <!-- Soap bar body -->
    <rect x="-90" y="-55" width="180" height="110" rx="28" fill="#fff" fill-opacity="0.7" stroke="#c9973a" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="-75" y="-42" width="150" height="84" rx="20" fill="none" stroke="#c9973a" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Botanical leaf -->
    <path d="M-15,-10 C-30,-35 0,-45 10,-48 C15,-30 5,-15 -15,-10 Z" fill="#7a9a60" fill-opacity="0.7"/>
    <path d="M-15,-10 C5,-5 20,-20 28,-35 C15,-35 0,-25 -15,-10 Z" fill="#587d3e" fill-opacity="0.7"/>
    <path d="M-15,-10 Q5,-25 10,-48" stroke="#fff" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Subtle bubbles -->
    <circle cx="75" cy="-60" r="14" fill="#fff" fill-opacity="0.5" stroke="#c9973a" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="95" cy="-45" r="8" fill="#fff" fill-opacity="0.4" stroke="#c9973a" stroke-width="0.8" stroke-opacity="0.3"/>
    <circle cx="60" cy="-80" r="6" fill="#fff" fill-opacity="0.4" stroke="#c9973a" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <!-- Studio Name -->
  <text x="300" y="360" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#4a0f1a" letter-spacing="1.5">
    KHUSHI MEHNDI STUDIO
  </text>
  
  <text x="300" y="390" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8b3a3a" letter-spacing="3" text-transform="uppercase">
    Handmade Organic Soap
  </text>

  <!-- Divider line -->
  <line x1="220" y1="415" x2="380" y2="415" stroke="#c9973a" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Status / Placeholder Label -->
  <text x="300" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#7a6252">
    Product Image Coming Soon
  </text>
</svg>
